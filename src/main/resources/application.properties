spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hrms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Office Geofence Configuration
app.geofence.office.latitude=${GEOFENCE_LATITUDE:12.8246935}
app.geofence.office.longitude=${GEOFENCE_LONGITUDE:80.0452905}
app.geofence.radius.meters=${GEOFENCE_RADIUS:500}

# Default Admin Configuration
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}

# Push Notification Schedules
attendance.reminder.morning=${ATTENDANCE_REMINDER_MORNING:0 50 9 * * ?}
attendance.reminder.evening=${ATTENDANCE_REMINDER_EVENING:0 0 18 * * ?}

# Shift Configuration
app.shift.name=${SHIFT_NAME:General Shift}
app.shift.start-time=${SHIFT_START_TIME:10:00}
app.shift.end-time=${SHIFT_END_TIME:18:00}
app.shift.second-half-start-time=${SHIFT_SECOND_HALF_START_TIME:13:00}

