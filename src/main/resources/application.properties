spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-to-a-secure-random-64-char-hex-string-for-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Office Geofence Configuration
app.geofence.office.latitude=${GEOFENCE_LATITUDE:12.8246935}
app.geofence.office.longitude=${GEOFENCE_LONGITUDE:80.0452905}
app.geofence.radius.meters=${GEOFENCE_RADIUS:500}

# Default Admin Configuration
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:changeme}

# Push Notification Schedules
attendance.reminder.morning=${ATTENDANCE_REMINDER_MORNING:0 50 9 * * ?}
attendance.reminder.evening=${ATTENDANCE_REMINDER_EVENING:0 0 18 * * ?}
